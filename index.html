<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a73e8">
    <title>اتجاه القبلة</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>اتجاه القبلة</h1>
            <p class="subtitle">حدد اتجاه الكعبة المشرفة من موقعك</p>
        </header>

        <section class="qibla-display" id="qiblaDisplay">
            <div class="compass-wrapper">
                <div class="compass-ring" id="compassRing">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="46" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
                        <circle cx="50" cy="50" r="40" fill="none" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="2,4"/>
                        <line x1="50" y1="6" x2="50" y2="12" stroke="#d93025" stroke-width="1.5"/>
                        <line x1="50" y1="88" x2="50" y2="94" stroke="#999" stroke-width="1"/>
                        <line x1="6" y1="50" x2="12" y2="50" stroke="#999" stroke-width="1"/>
                        <line x1="88" y1="50" x2="94" y2="50" stroke="#999" stroke-width="1"/>
                        <text x="50" y="10" text-anchor="middle" class="compass-label" fill="#d93025" font-size="6">شمال</text>
                        <text x="50" y="97" text-anchor="middle" class="compass-label">جنوب</text>
                        <text x="4" y="53" text-anchor="middle" class="compass-label">غرب</text>
                        <text x="96" y="53" text-anchor="middle" class="compass-label">شرق</text>
                    </svg>
                </div>
                <div class="qibla-indicator" id="qiblaIndicator" style="display:none;">
                    <div class="qibla-dot"></div>
                    <span class="qibla-label-tag">القبلة</span>
                </div>
            </div>

            <div class="bearing-info">
                <span class="bearing-value" id="bearingValue">--</span>
                <span class="bearing-unit">°</span>
            </div>
            <p class="bearing-direction" id="bearingDirection">في انتظار تحديد الموقع...</p>
            <div class="compass-status" id="compassStatus">
                <span class="pulse"></span>
                <span>البوصلة نشطة - حرّك الهاتف للبحث عن القبلة</span>
            </div>
        </section>

        <section class="location-section">
            <button id="getLocationBtn" class="btn btn-primary">تحديد موقعي تلقائياً</button>
            <button id="compassBtn" class="btn btn-compass" style="display:none;">تفعيل البوصلة</button>
            <p class="or-text">أو</p>
            <form id="manualForm" class="manual-form">
                <div class="input-group">
                    <label for="latInput">خط العرض</label>
                    <input type="number" id="latInput" step="any" placeholder="مثال: 24.7136" required>
                </div>
                <div class="input-group">
                    <label for="lngInput">خط الطول</label>
                    <input type="number" id="lngInput" step="any" placeholder="مثال: 46.6753" required>
                </div>
                <button type="submit" class="btn btn-secondary">حساب الاتجاه</button>
            </form>
            <p class="error-message" id="errorMessage"></p>
        </section>

        <section class="map-section" id="mapSection" style="display:none;">
            <div id="map" class="map"></div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/qibla.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
